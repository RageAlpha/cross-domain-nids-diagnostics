name: verify-release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: pip
      - name: Install exact environment
        run: python -m pip install -r requirements.txt
      - name: Run tests and released-value verification
        run: |
          pytest -q
          python verify_results.py
      - name: Run CPU-safe entry points
        run: |
          python run_h1.py
          python run_h2.py plan
          python run_h3.py plan
          python run_oracle.py dry-run
          python run_calibration.py --help
          python experiments/h2/compute_feature_shift.py --help
      - name: Check relocation from a foreign working directory
        working-directory: ${{ runner.temp }}
        run: |
          python "$GITHUB_WORKSPACE/run_h1.py"
          python "$GITHUB_WORKSPACE/run_h2.py" plan
          python "$GITHUB_WORKSPACE/run_h3.py" plan
          python "$GITHUB_WORKSPACE/run_oracle.py" dry-run
